services:
  collector:
    build: .
    image: browser-event-collector:latest
    ports:
      - "8080:8080"
    environment:
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:-}
      OUTPUT_MODE: file
      OUTPUT_DIR: /app/logs
      OUTPUT_FILE: browser-events.ndjson
      TRUST_PROXY: "true"
    volumes:
      - collector-logs:/app/logs
    restart: unless-stopped

volumes:
  collector-logs:
